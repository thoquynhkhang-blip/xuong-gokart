<style>
/* Layout: sticky header + one working view + bottom tab bar; every form opens in a sheet so live data never wipes typing. */
:root{
  --bg:#eceff1; --surface:#ffffff; --surface-2:#f5f7f8; --ink:#14181c; --muted:#5b6670; --line:#d5dbe0;
  --accent:#e8590c; --accent-ink:#ffffff;
  --ok:#2b8a3e; --ok-bg:#e3f3e6; --warn:#b07900; --warn-bg:#fff3cf; --bad:#c92a2a; --bad-bg:#fde5e5; --info:#1864ab; --info-bg:#e1eefb; --off:#6b7680; --off-bg:#e6e9ec;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif; --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1215; --surface:#181d22; --surface-2:#1f252b; --ink:#e8ecef; --muted:#97a2ac; --line:#2c343c;
  --accent:#ff7b2e; --accent-ink:#1a0d05;
  --ok:#51cf66; --ok-bg:#16301c; --warn:#fcc419; --warn-bg:#33290a; --bad:#ff6b6b; --bad-bg:#3a1717; --info:#74c0fc; --info-bg:#132a3d; --off:#8a949d; --off-bg:#262c32; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1215; --surface:#181d22; --surface-2:#1f252b; --ink:#e8ecef; --muted:#97a2ac; --line:#2c343c;
  --accent:#ff7b2e; --accent-ink:#1a0d05;
  --ok:#51cf66; --ok-bg:#16301c; --warn:#fcc419; --warn-bg:#33290a; --bad:#ff6b6b; --bad-bg:#3a1717; --info:#74c0fc; --info-bg:#132a3d; --off:#8a949d; --off-bg:#262c32; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font:700 22px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/7px 7px;border:1px solid var(--ink)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);font-weight:600}
.sync{width:9px;height:9px;border-radius:50%;background:var(--off)}
.sync.on{background:var(--ok)} .sync.err{background:var(--bad)}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-top:3px solid transparent}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--accent);border-top-color:var(--accent)}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);font-size:14px}
.banner.bad{background:var(--bad-bg)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font:700 20px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.sec-h .sub{color:var(--muted);font-size:13px}
.sec-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--line);text-decoration:none;color:inherit}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font:700 34px/1 var(--font-display)}
.tile .v small{font-size:18px;color:var(--muted)}
.tile .d{font-size:12.5px;color:var(--muted)}
.t-ok{border-left-color:var(--ok)} .t-warn{border-left-color:var(--warn)} .t-info{border-left-color:var(--info)} .t-bad{border-left-color:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
@media (max-width:520px){.quick{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.big{min-height:54px;font-size:16px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-san{background:var(--ok-bg);color:var(--ok)} .p-loi{background:var(--ok-bg);color:var(--warn)} .p-cho{background:var(--warn-bg);color:var(--warn)} .p-dang{background:var(--info-bg);color:var(--info)} .p-doi{background:var(--bad-bg);color:var(--bad)} .p-ngung{background:var(--off-bg);color:var(--off)} .p-xong{background:var(--ok-bg);color:var(--ok)} .p-huy{background:var(--off-bg);color:var(--off)}
.p-low{background:var(--warn-bg);color:var(--warn)} .p-out{background:var(--bad-bg);color:var(--bad)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:default}
.row:first-child{border-top:0}
button.row{cursor:pointer} button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600}
.row .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .big{font:700 24px/1 var(--font-display)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.grp{padding:8px 14px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.karts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.kart{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 8px 9px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-top:5px solid var(--ok);text-align:left}
.kart:hover{background:var(--surface-2)}
.kart .n{font:700 30px/1 var(--font-display)}
.kart .ty{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase}
.kart .s{font-size:11.5px;font-weight:700}
.k-san{border-top-color:var(--ok)} .k-san .s{color:var(--ok)}
.k-loi{border-top-color:var(--warn)} .k-loi .s{color:var(--warn)}
.k-cho{border-top-color:var(--warn)} .k-cho .s{color:var(--warn)}
.k-dang{border-top-color:var(--info)} .k-dang .s{color:var(--info)}
.k-doi{border-top-color:var(--bad)} .k-doi .s{color:var(--bad)}
.k-ngung{border-top-color:var(--off);opacity:.7} .k-ngung .s{color:var(--off)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--warn)}
.ticket.s-dang{border-left-color:var(--info)} .ticket.s-doi{border-left-color:var(--bad)} .ticket.s-xong{border-left-color:var(--ok)} .ticket.s-huy{border-left-color:var(--off)}
.ticket .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ticket .kn{font:700 22px/1 var(--font-display)}
.ticket .desc{overflow-wrap:anywhere}
.ticket .meta{font-size:12.5px;color:var(--muted)}
.ticket .acts{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chk .it{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.chk .it:first-child{border-top:0}
.chk .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.chk .it.done .box{background:var(--ok);border-color:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.veil{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-h h3{font:700 22px/1.1 var(--font-display);text-transform:uppercase;flex:1}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.sheet-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f>label,.f>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pnl{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.pnl input,.pnl select{width:100%;min-width:0;box-sizing:border-box}
.pnl .f2>*{min-width:0}
.pnl .r3{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.pnsum{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}
.ph-huy{opacity:.6}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
.opt.done{opacity:.75}
.opt .who2{margin-left:auto;font-size:12px;color:var(--ok);font-weight:600}
.sheet-f{position:sticky;bottom:0;background:var(--surface);padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.qr{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qr .l{font:700 20px/1 var(--font-display)}
.qr canvas,.qr img{width:100%!important;height:auto!important;max-width:120px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i aria-hidden="true"></i>Xưởng Gokart</div>
  <div class="who"><span class="sync" id="sync" title="Trạng thái dữ liệu"></span><button id="whoBtn" type="button">Bạn là ai?</button></div>
</div></header>
<main id="app"><div class="card muted">Đang tải dữ liệu xưởng…</div></main>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const DEFAULT_DAILY = ["Kiểm tra, quét dọn đường đua","Kiểm tra mối hàn hàng rào","Quét dọn sảnh","Lau xe","Kiểm tra và thay pin","Kiểm tra & sạc pin","Kiểm tra và châm nước phuy","Kiểm tra & sắp xếp nón"];
const DEFAULT_MAINT = ["Siết ốc thân vỏ","Xịt rỉ sét ốc (RP7)","Kiểm tra bánh trước + thước lái","Cân chỉnh + siết ốc cổ xe","Siết ốc bánh sau"];
const ISSUE_CATS = ["Lốp / Mâm","Bạc đạn / Trục","Pin / Sạc","Mạch / Nguồn","Động cơ","Phanh","Lái / Cổ xe","Thân vỏ / Ốc","Dây an toàn / Phụ kiện","Khác"];
const TYPES = {don:"Đơn", doi:"Đôi"};
const T_STATUS = {cho:"Chờ sửa", dang:"Đang sửa", doi:"Đợi phụ tùng", xong:"Đã xong", huy:"Đã hủy"};
const OPEN = ["cho","dang","doi"];
const mvLabel = m => m.kind==="gom_sua"&&(m.src==="moi"||m.src==="sua") ? "Báo hỏng từ kệ" : (MOVE_LABEL[m.kind]||m.kind);
const MOVE_LABEL = {cap:"Cấp xuống xưởng", nhap:"Nhập mua kho tổng", xuat:"Xuất / Thay", gom_sua:"Gom hàng hư", nhap_sau_sua:"Sửa được, nhập lại", huy:"Hủy", dieu_chinh:"Điều chỉnh"};
const TABS = [
  ["tong-quan","Tổng quan",'<path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'],
  ["xe","Xe",'<circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M4 14l2-6h8l3 6M10 8V5h4"/>'],
  ["sua","Sửa chữa",'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'],
  ["kho","Kho",'<path d="M3 8l9-5 9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10"/>'],
  ["checklist","Checklist",'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'],
  ["them","Thêm",'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>']
];

/* ---------- state ---------- */
const START_KART_T = "<?= startKart ?>";
/* Chạy được 2 kiểu: mở từ link Apps Script (google.script.run) hoặc từ trang app riêng (gọi API bằng fetch) */
const API_URL = window.GK_API || "https://xuong-gokart-api.tho-quynhkhang.workers.dev";
const IS_GAS = !!(window.google&&google.script&&google.script.run);
const START_KART = /^[a-z0-9-]*$/i.test(START_KART_T) && IS_GAS ? START_KART_T : (new URLSearchParams(location.search).get("xe")||"");
const S = {pin:"", role:"", isEditor:false, isTruong:false, pending:[], readOnly:false, loading:false, lastLoad:0,
  karts:new Map(), parts:new Map(), tOpen:new Map(), tRecent:new Map(), moves:[], checks:[], config:{},
  got:{}, timedOut:false, err:null,
  ui:{kartFilter:"all", partQ:"", stockLoc:"xuong", dc:null, ticketTab:"open", histFrom:null, histTo:null, hist:null, kartTicketsCache:{}}};
let curDay="", openedHash=null, pollT=null;
/* Mã ngày của checklist: dạng N20261118 để Google Sheet không tự đổi thành ô ngày tháng
   (ô ngày tháng đọc lại không khớp nên checklist đã làm không hiện dấu tích) */
const chkKey = d => "N"+String(d).replace(/-/g,"");

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z = n => String(n).padStart(2,"0");
function dayKey(d=new Date()){return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function fmtT(ms){ if(!ms) return ""; const d=new Date(ms); return z(d.getHours())+":"+z(d.getMinutes())+" "+z(d.getDate())+"/"+z(d.getMonth()+1); }
function fmtD(ms){ if(!ms) return ""; const d=new Date(ms); return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear(); }
function ago(ms){ if(!ms) return ""; const m=Math.round((Date.now()-ms)/60000); if(m<1) return "vừa xong"; if(m<60) return m+" phút"; const h=Math.round(m/60); if(h<48) return h+" giờ"; return Math.round(h/24)+" ngày"; }
function dur(ms){ if(!ms||ms<0) return "—"; const m=Math.round(ms/60000); if(m<60) return m+" phút"; const h=m/60; if(h<48) return (Math.round(h*10)/10)+" giờ"; return (Math.round(h/24*10)/10)+" ngày"; }
function strip(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D"); }
function slug(s){ return strip(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "x"; }
function normName(s){ return strip(String(s||"").trim().replace(/\s+/g," ")).toLowerCase(); }
function niceName(s){ return String(s||"").trim().replace(/\s+/g," ").split(" ").map(w=>w? w[0].toLocaleUpperCase("vi")+w.slice(1):w).join(" "); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function lsGet(k){ try{return localStorage.getItem(k)||"";}catch(e){return "";} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function daily(){ return Array.isArray(S.config.dailyItems)&&S.config.dailyItems.length? S.config.dailyItems : DEFAULT_DAILY; }
function maintItems(){ return Array.isArray(S.config.maintItems)&&S.config.maintItems.length? S.config.maintItems : DEFAULT_MAINT; }
function maintDays(){ return Number(S.config.maintDays)||7; }
function kartLabel(k){ return k? (TYPES[k.type]||"")+" "+k.num : "Không gắn xe"; }
function kartById(id){ return S.karts.get(id); }
function partLabel(p){ return p? p.name : "(phụ tùng đã xóa)"; }
function myName(){ return lsGet("gk_name"); }

/* ---------- toast ---------- */
let toastT=null;
function toast(msg, kind="", ms=3200){
  const r=$("#toastRoot"); r.innerHTML='<div class="toast '+kind+'" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML="";},ms);
}
function handleErr(e){
  const msg=String((e&&e.message)||e||"");
  if(/PIN_SAI/.test(msg)){ logout("Mã PIN đã đổi hoặc không đúng. Nhập lại mã PIN."); return; }
  toast(msg.replace(/^Error:\s*/,"")||"Lỗi không rõ, thử lại.","bad",7000);
  console.error(e);
}
function api(fn, ...args){
  return new Promise((res,rej)=>{
    if(!IS_GAS){
      fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:[S.pin,...args],op:OP_ID+":"+fn}),redirect:"follow"})
        .then(r=>{ if(!r.ok) throw new Error("Máy chủ lỗi "+r.status+". Thử lại."); return r.json(); })
        .then(j=>{ if(j&&j.ok) res(j.data===null?undefined:j.data); else rej(new Error((j&&j.error)||"Lỗi không rõ.")); })
        .catch(e=>rej(/Failed to fetch|NetworkError|Load failed/i.test(String(e&&e.message))? new Error("Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.") : e));
      return;
    }
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](S.pin, ...args);
  });
}
/* Chống bấm 2 lần: đang lưu thì bỏ qua lần bấm sau; máy chủ cũng tự bỏ lệnh trùng (cùng mã thao tác) */
let saving=false;
async function save(fn, okMsg){
  if(saving){ toast("Đang lưu, đợi chút…"); return false; }
  saving=true;
  try{ const r=await fn(); OP_ID=newOp(); if(okMsg) toast(okMsg,"ok"); load(); return r===undefined?true:r; }catch(e){ handleErr(e); return false; }
  finally{ saving=false; }
}
let OP_ID=newOp();
function newOp(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }

/* ---------- derived ---------- */
function allTickets(){ const m=new Map(S.tRecent); for(const [k,v] of S.tOpen) m.set(k,v); return m; }
function openTickets(){ return [...S.tOpen.values()].filter(t=>OPEN.includes(t.status)); }
function openByKart(){ const m={}; for(const t of openTickets()){ (m[t.kartId]=m[t.kartId]||[]).push(t); } return m; }
function kartStatus(k, obk){
  if(k.active===false) return {key:"ngung", label:"Ngưng dùng"};
  const ts=(obk||openByKart())[k.id]||[];
  const bl=ts.filter(t=>t.blocking!==false);
  if(bl.some(t=>t.status==="dang")) return {key:"dang", label:"Đang sửa"};
  if(bl.some(t=>t.status==="doi")) return {key:"doi", label:"Đợi phụ tùng"};
  if(bl.length) return {key:"cho", label:"Chờ sửa"};
  if(ts.length) return {key:"loi", label:"Chạy · lỗi nhẹ"};
  return {key:"san", label:"Sẵn sàng"};
}
function applyMove(a, m){
  const q=Number(m.qty)||0;
  switch(m.kind){
    case "nhap": a.tong+=q; break;
    case "cap": a.tong-=q; a.moi+=q; break;
    case "xuat": if(m.src==="sua") a.sua-=q; else a.moi-=q; break;
    case "gom_sua": a.cho+=q; if(m.src==="moi"||m.src==="sua") a[m.src]-=q; break;
    case "nhap_sau_sua": a.cho-=q; a.sua+=q; break;
    case "huy": { const l=m.loc||(m.from==="tot"?"moi":"cho"); a[l]-=q; break; }
    case "dieu_chinh": { const l=m.loc||"moi"; a[l]+=q; break; }
  }
}
function stockMap(uptoMs){
  const res={};
  for(const p of S.parts.values()){ const b=p.base||{}; res[p.id]={tong:+b.tong||0, moi:+b.moi||0, sua:+b.sua||0, cho:+b.cho||0, at:+b.at||0}; }
  for(const m of S.moves){ const a=res[m.partId]; if(!a||m.at<=a.at) continue; if(uptoMs!=null&&m.at>uptoMs) continue; applyMove(a,m); }
  for(const k in res) res[k].xuong=res[k].moi+res[k].sua;
  return res;
}
function partState(p, st, where){ const s=st[p.id]||{xuong:0,tong:0};
  if(where==="tong"){ const th=+p.threshTong||0; if(s.tong<=0) return {key:"out",label:"Kho tổng hết"}; if(th>0&&s.tong<=th) return {key:"low",label:"Cần mua thêm"}; return null; }
  const th=+p.threshold||0; if(s.xuong<=0) return {key:"out",label:"Kệ xưởng hết"}; if(th>0&&s.xuong<=th) return {key:"low",label:"Cần cấp xuống"}; return null; }
function pendingOf(pid){ return S.pending.filter(x=>x.partId===pid); }
function sortedKarts(){ return [...S.karts.values()].sort((a,b)=> (a.type===b.type?0:(a.type==="don"?-1:1)) || (Number(a.num)-Number(b.num)) || String(a.num).localeCompare(String(b.num))); }
function sortedParts(){ return [...S.parts.values()].filter(p=>p.active!==false).sort((a,b)=> String(a.group).localeCompare(String(b.group),"vi") || String(a.name).localeCompare(String(b.name),"vi")); }
function recentNames(){
  const seen=new Map();
  const add=n=>{ const k=normName(n); if(k && !seen.has(k)) seen.set(k, niceName(n)); };
  add(myName());
  [...S.moves].slice(0,400).forEach(m=>add(m.by));
  [...allTickets().values()].forEach(t=>{add(t.reporter); add(t.fixer);});
  S.checks.forEach(c=>add(c.by));
  return [...seen.values()].slice(0,60);
}

/* ---------- data wiring ---------- */
function setSync(){
  const el=$("#sync"); if(!el) return;
  el.className="sync"+(S.err?" err":S.lastLoad?" on":""); el.title = S.err? "Lỗi kết nối" : S.lastLoad? "Cập nhật lúc "+fmtT(S.lastLoad) : "Đang tải…";
}
let renderQ=false;
function rerender(){ if(renderQ) return; renderQ=true; requestAnimationFrame(()=>{renderQ=false; render();}); }
async function load(){
  if(!S.pin||S.loading) return; S.loading=true;
  const d=dayKey(); if(d!==curDay) curDay=d;
  try{
    const r=await api("getAll", chkKey(curDay), S.ver||"");
    if(r.same){ S.err=null; S.lastLoad=Date.now(); S.loading=false; rerender(); return; }
    S.ver=r.ver||""; S.role=r.role; S.isEditor=r.role==="admin"; S.isTruong=r.role==="admin"||r.role==="truong"; S.pending=r.pending||[]; S.config=r.config||{};
    S.karts=new Map(r.karts.map(x=>[x.id,x])); S.parts=new Map(r.parts.map(x=>[x.id,x]));
    S.tOpen=new Map(r.tOpen.map(x=>[x.id,x])); S.tRecent=new Map(r.tRecent.map(x=>[x.id,x]));
    S.moves=r.moves; S.checks=r.checks.sort((a,b)=>a.at-b.at);
    S.got={config:1,karts:1,parts:1,tOpen:1,moves:1}; S.err=null; S.lastLoad=Date.now();
  }catch(e){ const m=String((e&&e.message)||e); if(/PIN_SAI/.test(m)){ S.loading=false; logout("Mã PIN không đúng."); return; } S.err={code:m}; }
  S.loading=false; rerender();
}
function logout(msg){ S.ver=""; S.ui.stockLoc="xuong"; S.ui.dc=null; S.pending=[]; S.pin=""; lsSet("gk_pin",""); S.lastLoad=0; S.karts=new Map(); S.parts=new Map(); render(); if(msg) toast(msg,"bad",6000); }
async function boot(){
  curDay=dayKey();
  S.pin=lsGet("gk_pin");
  if(START_KART && /^[a-z0-9-]+$/.test(START_KART)){ if(!IS_GAS) history.replaceState(null,"",location.pathname); location.hash="xe-"+START_KART; }
  render();
  if(S.pin) await load();
  if(pollT) clearInterval(pollT);
  pollT=setInterval(()=>{ if(document.visibilityState==="visible" && !$("#veil")) load(); }, 30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-S.lastLoad>15000) load(); });
}

/* ---------- routing / render ---------- */
function route(){ return (location.hash||"").replace(/^#/,"") || "tong-quan"; }
function go(h){ if(location.hash==="#"+h) onRoute(); else location.hash=h; }
window.addEventListener("hashchange", onRoute);
function onRoute(){ openedHash=null; render(); window.scrollTo(0,0); }

function render(){
  // keep focus & caret across live re-renders
  const ae=document.activeElement; const fid=ae&&ae.id&&$("#app").contains(ae)?ae.id:null; const sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;

  $("#tabs").innerHTML = TABS.map(([k,l,ic])=>'<a href="#'+k+'" class="'+(k===tabKey?"on":"")+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ic+'</svg>'+l+'</a>').join("");

  } else {
    if(S.err) html+='<div class="banner bad">Mất kết nối, số liệu có thể chưa mới nhất. <button class="btn sm" type="button" data-a="reload">Tải lại</button></div>';
    if(S.isEditor && S.moves.length>=1500) html+='<div class="banner">Đã có '+S.moves.length+' giao dịch kho từ lần chốt sổ gần nhất. Vào <a href="#cai-dat">Cài đặt → Chốt sổ kho</a> để app chạy nhanh hơn.</div>';
    const v = r.startsWith("xe")? vKarts : ({"tong-quan":vHome, sua:vTickets, kho:vStock, checklist:vCheck, them:vMore, "lich-su":vHistory, "cai-dat":vSettings, "doi-chieu":vDoiChieu, "phieu-nhap":vPhieuNhap, "vat-tu-hong":vHong, qr:vQR})[r] || vHome;

  $("#app").innerHTML=html;
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); if(sel&&el.setSelectionRange){ try{el.setSelectionRange(sel[0],sel[1]);}catch(e){} } } }

  h+='<section class="sec"><div class="sec-h"><h2>Xe đang nằm xưởng</h2><span class="sub">'+ot.length+' phiếu mở, cũ nhất lên đầu</span><div class="act"><a class="btn sm" href="#sua">Tất cả phiếu</a></div></div>';

function partRow(p, st, where){
  const s=st[p.id]||{tong:0,moi:0,sua:0,cho:0,xuong:0}; const ps=partState(p,st,where); const pend=pendingOf(p.id).length;

  else { big=s.xuong; sub='Mới '+s.moi+' · Đã sửa '+s.sua+(s.cho?' · Hư chờ kiểm tra '+s.cho:'')+(+p.threshold?' · Ngưỡng '+esc(p.threshold):''); }

  return '<button class="row" type="button" data-a="part" data-id="'+esc(p.id)+'"><div class="main"><span class="t">'+esc(p.name)+'</span><span class="m">'+sub+'</span></div><div class="r"><span class="big num" style="color:'+(ps?(ps.key==="out"?"var(--bad)":"var(--warn)"):"inherit")+'">'+big+'</span><span class="m">'+esc(p.unit||"")+'</span>'+(ps?'<span class="pill p-'+ps.key+'">'+ps.label+'</span>':'')+'</div></button>';

function pendingSection(){

function dcTables(rows){
  const neg=v=>v<0?'<b style="color:var(--bad)">'+v+'</b>':v>0?'<b style="color:var(--warn)">+'+v+'</b>':'0';
  const T1=[], T2=[], T3=[], T4=[];
  rows.forEach(r=>{ const a=r.a, s0=r.start, s1=r.end;
    const x0=s0.moi+s0.sua, A=a.cap, B=a.xuatMoi+a.xuatSua, C=a.suaDuoc, H=a.huyMoi+a.huySua, K=a.hong||0, so=x0+A-B-K+C-H, dcx=a.dcMoi+a.dcSua, x1=s1.moi+s1.sua;
    T1.push({r, cells:[x0,A,B,K,C,H,so,dcx,x1], key:dcx, act:A||B||K||C||H||dcx});
    const unk=B-a.gom-a.bo;
    T2.push({r, cells:[B,a.gom,a.bo,unk], key:unk, act:B||a.gom||a.bo});
    T3.push({r, cells:[s0.cho,a.gom+(a.hong||0),a.suaDuoc,a.huyCho,a.dcCho,s1.cho], key:a.dcCho, act:a.gom||a.hong||a.suaDuoc||a.huyCho||a.dcCho});
    const t0=s0.tong, soT=t0+a.nhap-a.cap-a.huyTong;
    T4.push({r, cells:[t0,a.nhap,a.cap,a.huyTong,soT,a.dcTong,s1.tong], key:a.dcTong, act:a.nhap||a.cap||a.huyTong||a.dcTong});
  });
  return {T1,T2,T3,T4,neg};
}

  h+=tbl("1. Kệ xưởng","cuối kỳ = đầu + cấp xuống − thay cho xe − báo hỏng + sửa được − hủy ± chênh lệch",["Đầu kỳ","Cấp xuống","Thay cho xe","Báo hỏng","Sửa được về kệ","Hủy tại kệ","Theo sổ","Chênh lệch kiểm kê","Cuối kỳ"],T1,7);

A.tWait = d=>{ if(!guardWrite()) return; modal("Đợi phụ tùng", '<div class="f"><label for="fWait">Đang đợi gì?</label><input id="fWait" type="text" placeholder="Ví dụ: mâm trước, động cơ 350W"></div>'+nameField(), '<button class="btn pri" type="button" data-a="tWaitSave" data-id="'+esc(d.id)+'">Lưu</button>'); };
A.tWaitSave = d=>{ const by=readName(); if(!by) return; tUpdate(d.id,{status:"doi", waitNote:val("fWait"), waitAt:Date.now(), fixer:by},"Đã chuyển sang đợi phụ tùng"); };
A.tDone = d=>{ if(!guardWrite()) return; const t=allTickets().get(d.id); const used=S.moves.filter(m=>m.ticketId===d.id&&m.kind==="xuat");
  modal("Hoàn tất sửa", (used.length?'<div class="small">Đã ghi thay: '+used.map(m=>esc(partLabel(S.parts.get(m.partId)))+' ×'+m.qty).join(", ")+'</div>':'<div class="banner small">Phiếu này chưa ghi phụ tùng nào. Nếu có thay, bấm "Thay phụ tùng" trước khi hoàn tất để kho trừ đúng.</div>')

A.tDoneSave = d=>{ const by=readName(); if(!by) return; tUpdate(d.id,{status:"xong", doneAt:Date.now(), fixer:by, result:val("fRes")},"Đã hoàn tất, xe trở lại sẵn sàng"); };
A.tCancel = d=>{ if(!guardWrite()) return; modal("Hủy phiếu", '<div class="f"><label for="fRes">Lý do hủy</label><input id="fRes" type="text" placeholder="Ví dụ: báo nhầm xe, xe thanh lý"></div>'+nameField(), '<button class="btn pri" type="button" data-a="tCancelSave" data-id="'+esc(d.id)+'">Hủy phiếu</button>'); };
A.tCancelSave = d=>{ const by=readName(); if(!by) return; if(!val("fRes")){ toast("Ghi lý do hủy.","bad"); return; } tUpdate(d.id,{status:"huy", doneAt:Date.now(), result:val("fRes"), cancelBy:by},"Đã hủy phiếu"); };

    (tk?'<div class="small muted">Gắn với phiếu: '+esc(kartLabel(kartById(tk.kartId)))+' · '+esc(tk.issue||"")+'</div>':'')

   +'<div class="f"><label for="fPart">Phụ tùng lấy từ kệ xưởng</label>'+partSelect("fPart","")+'</div>'
   +'<div class="f" id="srcBox"></div>'
   +'<div class="f"><label for="fQty">Số lượng</label><input id="fQty" type="number" inputmode="numeric" min="1" step="1" value="1"></div>'
   +'<div class="f"><span class="lb">Đồ cũ tháo ra</span><div class="opts"><label class="opt"><input type="radio" name="fOld" value="gom" checked> Gom lại chờ thợ kiểm tra (không chắc thì chọn mục này)</label><label class="opt"><input type="radio" name="fOld" value="bo"> Bỏ hẳn (cháy, bể nát) – ghi lý do</label></div></div>'
   +'<div class="f"><label for="fNote">Ghi chú / lý do bỏ</label><input id="fNote" type="text" placeholder="Bắt buộc nếu bỏ đồ cũ"></div>'+nameField(),
    '<button class="btn pri" type="button" data-a="useSave" data-ticket="'+esc(d.ticket||"")+'">Ghi thay phụ tùng</button>');
  const upd=()=>{ const s=stockMap()[val("fPart")]; const box=$("#srcBox"); if(!box) return; if(!s){ box.innerHTML=""; return; }
    box.innerHTML='<span class="lb">Lấy loại hàng nào?</span><div class="opts"><label class="opt"><input type="radio" name="fSrc" value="sua" '+(s.sua>0?"checked":"disabled")+'> Hàng đã sửa – còn '+s.sua+' (ưu tiên dùng trước)</label><label class="opt"><input type="radio" name="fSrc" value="moi" '+(s.sua>0?"":"checked")+'> Hàng mới – còn '+s.moi+'</label></div>'; };

A.useSave = async d=>{
  const partId=val("fPart"), qty=num("fQty"); if(!partId){ toast("Chọn phụ tùng.","bad"); return; } if(!(qty>0)||!Number.isInteger(qty)){ toast("Số lượng phải là số nguyên lớn hơn 0.","bad"); return; }
  const by=readName(); if(!by) return;
  const kartId=val("fKart")||""; const ticketId=d.ticket||""; const note=val("fNote"); const old=(document.querySelector('input[name=fOld]:checked')||{}).value||"gom";
  const src=(document.querySelector('input[name=fSrc]:checked')||{}).value||"moi";
  if(old==="bo"&&!note){ toast("Ghi lý do bỏ đồ cũ.","bad"); return; }
  const s=stockMap()[partId]||{moi:0,sua:0}; const left=(src==="sua"?s.sua:s.moi)-qty;
  const list=[{kind:"xuat", partId, qty, kartId, ticketId, by, note, src, old}];
  if(old==="gom") list.push({kind:"gom_sua", partId, qty, kartId, ticketId, by, note:"Đồ cũ tháo từ "+kartLabel(kartById(kartId))});
  const r=await save(()=>api("addMoves", list));
  if(r){ closeModal(); toast("Đã ghi thay "+qty+" "+partLabel(S.parts.get(partId))+(r.pending?". Đồ cũ chờ trưởng bộ phận xác nhận đã nhận.":"")+(left<0?" (kệ đang âm, báo trưởng bộ phận)":""), left<0?"bad":"ok", 6000); }
};
A.mv = d=>{
  if(!guardWrite()) return;

  const titles={nhap:"Nhập mua vào kho tổng", cap:"Cấp từ kho tổng xuống kệ xưởng", gom_sua:"Gom hàng hư chờ kiểm tra", huy:"Hủy hàng", dieu_chinh:"Kiểm kê, điều chỉnh"};
  let where = k==="nhap"||k==="cap"||(d.loc==="tong") ? "tong" : "xuong";
  let body='<div class="f"><label for="fPart">Phụ tùng</label>'+partSelect("fPart", d.part||"", null, where)+'</div>';
  if(k==="dieu_chinh"){
    const locs = d.loc==="tong" ? [["tong","Kho tổng"]] : [["moi","Kệ xưởng – hàng mới"],["sua","Kệ xưởng – hàng đã sửa"],["cho","Hàng hư chờ kiểm tra"]];
    body+='<div class="f"><label for="fLoc">Vị trí đếm</label><select id="fLoc">'+locs.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join("")+'</select></div>';
    body+='<div class="f"><label for="fQty">Số đếm thực tế</label><input id="fQty" type="number" inputmode="numeric" min="0" step="1"><span class="hint">App tự tính chênh lệch so với sổ và ghi lại để đối chiếu.</span></div>';
  } else body+='<div class="f"><label for="fQty">Số lượng</label><input id="fQty" type="number" inputmode="numeric" min="1" step="1" value="1"></div>';
  if(k==="huy"){
    const opts = d.loc==="tong" ? [["tong","Hàng trong kho tổng"]] : [["moi","Hàng mới trên kệ xưởng (lỗi, bể)"],["sua","Hàng đã sửa trên kệ xưởng (hư lại)"]];
    body+='<div class="f"><span class="lb">Hủy từ đâu?</span><div class="opts">'+opts.map(([v,l],i)=>'<label class="opt"><input type="radio" name="fLoc2" value="'+v+'" '+(i===0?"checked":"")+'> '+l+'</label>').join("")+'</div><span class="hint">Hàng hư sau khi thợ kiểm tra thì ghi ở mục Thợ kiểm tra hàng hư.</span></div>';
  }
  if(k==="gom_sua") body+='<div class="f"><label for="fKart">Tháo từ xe (nếu có)</label>'+kartSelect("fKart","",true)+'</div>'+(S.isTruong?'':'<div class="small muted">Trưởng bộ phận xác nhận đã nhận đồ thì mới tính vào hàng hư chờ kiểm tra.</div>');
  body+='<div class="f"><label for="fNote">'+(k==="huy"?"Lý do hủy":"Ghi chú")+'</label><input id="fNote" type="text" placeholder="'+(k==="nhap"?"Nhà cung cấp, số phiếu nhập":k==="huy"?"Ví dụ: bơm không vô, rạn mâm":k==="cap"?"Ví dụ: cấp bổ sung kệ lốp":"Không bắt buộc")+'"></div>'+nameField();
  modal(titles[k]||"Kho", body, '<button class="btn pri" type="button" data-a="mvSave" data-k="'+k+'">Lưu</button>');
};
A.mvSave = async d=>{
  const k=d.k; const partId=val("fPart"); let qty=num("fQty");
  if(!partId){ toast("Chọn phụ tùng.","bad"); return; }
  if(val("fQty")===""||!Number.isInteger(qty)||qty<0||(k!=="dieu_chinh"&&qty===0)){ toast("Nhập số lượng hợp lệ.","bad"); return; }
  const by=readName(); if(!by) return;
  const note=val("fNote"); if(k==="huy"&&!note){ toast("Ghi lý do hủy.","bad"); return; }
  const m={kind:k, partId, qty, by, note};
  const st=stockMap()[partId]||{tong:0,moi:0,sua:0,cho:0};
  if(k==="dieu_chinh"){ m.loc=val("fLoc"); const cur=st[m.loc]||0; m.qty=qty-cur; m.note=(note?note+" · ":"")+"Kiểm kê: sổ "+cur+" → đếm "+qty; if(m.qty===0){ toast("Số đếm khớp với sổ, không cần điều chỉnh.","ok"); closeModal(); return; } }
  if(k==="huy") m.loc=(document.querySelector('input[name=fLoc2]:checked')||{}).value||"moi";
  if(k==="gom_sua") m.kartId=val("fKart")||"";
  if(k==="cap" && qty>st.tong) toast("Lưu ý: kho tổng trên sổ chỉ còn "+st.tong+".","bad",5000);
  const r=await save(()=>api("addMoves",[m]));
  if(r){ closeModal(); toast(r.pending? "Đã gửi, chờ trưởng bộ phận xác nhận." : "Đã lưu: "+(MOVE_LABEL[k]||k)+" "+partLabel(S.parts.get(partId))+(k==="dieu_chinh"?" (chênh "+(m.qty>0?"+":"")+m.qty+")":""),"ok",5000); }
};

/* ---------- báo vật tư hỏng (không gắn với xe) ---------- */
A.hong = d=>{
  if(!guardWrite()) return;
  const st=stockMap(); const coKe=p=>{ const s=st[p.id]||{}; return (s.moi||0)+(s.sua||0)>0 || p.id===d.part; };
  if(!sortedParts().some(coKe)){ toast("Kệ xưởng chưa có vật tư nào.","bad"); return; }
  modal("Báo vật tư hỏng",
    '<div class="small muted">Dùng khi vật tư trên kệ xưởng bị hỏng lúc đang dùng (pin, sạc…), không gắn với xe nào. Hỏng do tháo ra khi thay cho xe thì ghi ở phần Thay phụ tùng.</div>'
   +'<div class="f"><label for="fPart">Vật tư hỏng</label>'+partSelect("fPart", d.part||"", coKe, "xuong")+'</div>'
   +'<div class="f"><label for="fQty">Số lượng hỏng</label><input id="fQty" type="number" inputmode="numeric" min="1" step="1" value="1"></div>'
   +'<div class="f"><span class="lb">Cái hỏng là hàng nào?</span><div class="opts" id="fSrcBox"></div></div>'
   +'<div class="f"><label for="fNote">Hỏng thế nào?</label><input id="fNote" type="text" placeholder="Ví dụ: pin không giữ điện, sạc không lên đèn"></div>'
   +nameField("fBy","Người báo")
   +(S.isTruong?'':'<div class="small muted">Trưởng bộ phận xác nhận đã nhận đồ hỏng thì kệ xưởng mới trừ và chuyển sang hàng hư chờ kiểm tra.</div>'),
    '<button class="btn pri" type="button" data-a="hongSave">Gửi báo hỏng</button>');
  const ve=()=>{ const s=st[val("fPart")]||{moi:0,sua:0}; const box=$("#fSrcBox"); if(!box) return;
    const cur=(document.querySelector('input[name=fSrc]:checked')||{}).value;
    const opts=[["moi","Hàng mới (đang có "+(s.moi||0)+")"],["sua","Hàng đã sửa, hư lại (đang có "+(s.sua||0)+")"]];
    const def = cur || ((s.moi||0)>0||!(s.sua>0) ? "moi" : "sua");
    box.innerHTML=opts.map(([v,l])=>'<label class="opt"><input type="radio" name="fSrc" value="'+v+'" '+(v===def?"checked":"")+'> '+l+'</label>').join(""); };
  ve(); const sel=$("#fPart"); if(sel) sel.addEventListener("change",ve);
};
A.hongSave = async ()=>{
  const partId=val("fPart"), qty=num("fQty"), note=val("fNote");
  if(!partId){ toast("Chọn vật tư hỏng.","bad"); return; }
  if(!Number.isInteger(qty)||qty<=0){ toast("Nhập số lượng hỏng.","bad"); return; }
  const src=(document.querySelector('input[name=fSrc]:checked')||{}).value||"moi";
  const s=stockMap()[partId]||{moi:0,sua:0};
  if(qty>(s[src]||0)){ toast("Kệ xưởng chỉ còn "+(s[src]||0)+" "+(src==="sua"?"hàng đã sửa":"hàng mới")+".","bad",5000); return; }
  if(!note){ toast("Ghi ngắn gọn hỏng thế nào.","bad"); return; }
  const by=readName(); if(!by) return;
  const r=await save(()=>api("addMoves",[{kind:"gom_sua", src, partId, qty, by, note}]));
  if(r){ closeModal(); toast(r.pending? "Đã gửi báo hỏng, chờ trưởng bộ phận xác nhận." : "Đã ghi: "+qty+" "+partLabel(S.parts.get(partId))+" hỏng, chuyển sang hàng hư chờ kiểm tra.","ok",5000); }
};
function hongData(){
  const tuKe=m=>m.kind==="gom_sua"&&(m.src==="moi"||m.src==="sua");
  const reps=S.moves.filter(tuKe).slice().sort((a,b)=>b.at-a.at);
  const pend=S.pending.filter(x=>x.type==="gom"&&(x.src==="moi"||x.src==="sua")).slice().sort((a,b)=>b.at-a.at);
  const st=stockMap(); const agg={};
  const g=id=>agg[id]=agg[id]||{bao:0,cho:0,sua:0,huy:0};
  reps.forEach(m=>g(m.partId).bao+=Number(m.qty)||0);
  pend.forEach(x=>g(x.partId).cho+=Number(x.qty)||0);
  S.moves.forEach(m=>{ if(!agg[m.partId]) return; const q=Number(m.qty)||0; if(m.kind==="nhap_sau_sua") agg[m.partId].sua+=q; else if(m.kind==="huy"&&(m.loc||"cho")==="cho") agg[m.partId].huy+=q; });
  const rows=sortedParts().filter(p=>agg[p.id]).map(p=>({p, a:agg[p.id], s:st[p.id]||{}}));
  return {reps, pend, rows};
}
function vHong(){
  const D=hongData(); const since=Number(S.config.closingAt)||0;
  let h='<section class="sec"><div class="sec-h"><h2>Vật tư hỏng</h2><span class="sub">vật tư trên kệ báo hỏng lúc đang dùng'+(since?', từ lần chốt sổ '+fmtD(since):'')+'</span>'+(S.readOnly?'':'<div class="act"><button class="btn pri sm" type="button" data-a="hong">Báo vật tư hỏng</button></div>')+'</div>';
  const tong=D.rows.reduce((a,r)=>a+r.a.bao,0), cho=D.pend.reduce((a,x)=>a+x.qty,0), kt=D.rows.reduce((a,r)=>a+(r.s.cho||0),0);
  h+='<section class="tiles"><div class="tile t-bad"><span class="k">Đã báo hỏng</span><span class="v num">'+tong+'</span><span class="d">đã xác nhận</span></div><div class="tile t-warn"><span class="k">Chờ xác nhận</span><span class="v num">'+cho+'</span><span class="d">'+D.pend.length+' lần báo</span></div><div class="tile t-info"><span class="k">Đang chờ kiểm tra</span><span class="v num">'+kt+'</span><span class="d">của các vật tư này</span></div></section>';
  if(S.isTruong && kt) h+='<div class="inline"><button class="btn" type="button" data-a="ktra">Ghi kết quả kiểm tra hàng hư</button></div>';
  h+= D.rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Vật tư</th><th class="n">Đã báo hỏng</th><th class="n">Chờ xác nhận</th><th class="n">Đang chờ kiểm tra</th><th class="n">Sửa được</th><th class="n">Hỏng hẳn</th><th class="n">Kệ còn dùng được</th></tr></thead><tbody>'
    +D.rows.map(r=>'<tr><td>'+esc(r.p.name)+'<div class="small muted">'+esc(r.p.group)+'</div></td><td class="n"><b>'+r.a.bao+'</b></td><td class="n">'+r.a.cho+'</td><td class="n">'+(r.s.cho||0)+'</td><td class="n">'+r.a.sua+'</td><td class="n">'+r.a.huy+'</td><td class="n">'+((r.s.moi||0)+(r.s.sua||0))+'</td></tr>').join("")+'</tbody></table></div><div class="small muted">Sửa được, hỏng hẳn và đang chờ kiểm tra tính chung cả đồ hư tháo từ xe của cùng vật tư.</div>'
    : '<div class="card small muted">Chưa có vật tư nào bị báo hỏng.</div>';
  const list=D.pend.map(x=>({at:x.at,partId:x.partId,qty:x.qty,src:x.src,note:x.note,by:x.by,cho:1})).concat(D.reps.map(m=>({at:m.at,partId:m.partId,qty:m.qty,src:m.src,note:m.note,by:m.by})));
  h+='<div class="sec-h"><h2 style="font-size:18px">Các lần báo hỏng</h2><span class="sub">'+list.length+' lần</span></div>';
  h+= list.length ? '<div class="list">'+list.slice(0,200).map(x=>'<div class="row"><div class="main"><span class="t">'+esc(partLabel(S.parts.get(x.partId)))+' × '+x.qty+'</span><span class="m">'+esc(x.note||"")+'</span><span class="m">'+esc(x.by||"")+' · '+fmtT(x.at)+' · '+(x.src==="sua"?"hàng đã sửa":"hàng mới")+'</span></div><div class="r">'+(x.cho?'<span class="pill p-cho">Chờ xác nhận</span>':'<span class="pill p-out">Đã ghi</span>')+'</div></div>').join("")+'</div>' : '';
  if(list.length) h+='<div class="inline"><button class="btn" type="button" data-a="hongExport">Xuất vật tư hỏng ra Excel</button></div>';
  return h+'</section>';
}
A.hongExport = (d,btn)=>{
  const D=hongData();
  const t1=[["Nhóm","Vật tư","Đơn vị","Đã báo hỏng","Chờ xác nhận","Đang chờ kiểm tra","Sửa được","Hỏng hẳn","Kệ còn dùng được"]].concat(D.rows.map(r=>[r.p.group,r.p.name,r.p.unit||"",r.a.bao,r.a.cho,r.s.cho||0,r.a.sua,r.a.huy,(r.s.moi||0)+(r.s.sua||0)]));
  const t2=[["Thời gian","Nhóm","Vật tư","Số lượng","Hàng","Hỏng thế nào","Người báo","Trạng thái"]].concat(D.pend.map(x=>[fmtT(x.at),(S.parts.get(x.partId)||{}).group||"",x.partName,x.qty,x.src==="sua"?"Đã sửa":"Mới",x.note||"",x.by||"","Chờ xác nhận"])).concat(D.reps.map(m=>{ const p=S.parts.get(m.partId)||{}; return [fmtT(m.at),p.group||"",p.name||m.partName,m.qty,m.src==="sua"?"Đã sửa":"Mới",m.note||"",m.by||"","Đã ghi"]; }));
  return xuatNut(btn, "Xuất vật tư hỏng ra Excel", "Vật tư hỏng Gokart "+fmtD(Date.now()), [{name:"Tổng hợp",rows:t1},{name:"Các lần báo",rows:t2}]);
};
A.sloc = d=>{ S.ui.stockLoc=d.v; render(); };
A.ktra = d=>{
  if(!guardWrite()) return;
  if(!S.isTruong){ toast("Chỉ trưởng bộ phận ghi kết quả kiểm tra hàng hư.","bad"); return; }
  const st=stockMap(); const has=sortedParts().filter(p=>(st[p.id]||{}).cho>0);

/* ---------- xuất file Excel ngay trên máy (không cần Google) ---------- */
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="xlsx.full.min.js"; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error("Không tải được bộ tạo file Excel. Kiểm tra mạng rồi thử lại.")); document.head.appendChild(s); });
}
async function xuatFile(title, tables){
  const X=await loadXlsx(); const wb=X.utils.book_new();
  tables.forEach(t=>{ const ws=X.utils.aoa_to_sheet(t.rows||[]); const w=(t.rows&&t.rows[0]||[]).map((_,j)=>({wch:Math.min(40,Math.max(8,...(t.rows||[]).slice(0,200).map(r=>String(r[j]==null?"":r[j]).length)))})); ws["!cols"]=w; X.utils.book_append_sheet(wb, ws, String(t.name).replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31)); });
  X.writeFile(wb, String(title).replace(/[\\\/:*?"<>|]/g,"-")+".xlsx");
}
async function xuatNut(btn, label, title, tables){
  btn.disabled=true; btn.textContent="Đang tạo file…";
  try{ await xuatFile(title, tables); toast("Đã tải file Excel về máy","ok"); }catch(e){ handleErr(e); }
  btn.disabled=false; btn.textContent=label;
}

A.pnNew = d=>{

A.pnSave = async (d,btn)=>{
  const P=S.ui.pn; const by=readName(); if(!by) return;
  const items=[];
  for(let i=0;i<P.items.length;i++){ const it=P.items[i]; const q=Number(it.qty);
    if(!it.partId && !q) continue;
    if(!it.partId){ toast("Dòng "+(i+1)+": chọn vật tư.","bad"); return; }
    if(it.partId==="__new" && !String(it.newName).trim()){ toast("Dòng "+(i+1)+": gõ tên vật tư mới.","bad"); return; }
    if(!Number.isInteger(q)||q<=0){ toast("Dòng "+(i+1)+": số lượng không hợp lệ.","bad"); return; }
    items.push(it.partId==="__new"? {partId:"", newName:niceName(it.newName), newGroup:String(it.newGroup).trim(), newUnit:String(it.newUnit).trim(), qty:q} : {partId:it.partId, qty:q});
  }
  if(!items.length){ toast("Phiếu chưa có dòng nào.","bad"); return; }
  const dup=items.filter(x=>x.partId).map(x=>x.partId).filter((x,i,a)=>a.indexOf(x)!==i); if(dup.length){ toast("Có vật tư bị lặp: "+partLabel(S.parts.get(dup[0]))+". Gộp lại 1 dòng.","bad",6000); return; }
  const ngay=P.ngay? new Date(P.ngay+"T12:00:00").getTime() : Date.now();
  btn.disabled=true; btn.textContent="Đang lưu…";
  const r=await save(()=>api("taoPhieuNhap",{ngay, kiemBy:niceName(P.kiemBy), note:P.note.trim(), by, items}));
  btn.disabled=false; btn.textContent="Lưu phiếu & cộng kho tổng";
  if(r){ closeModal(); S.ui.pnList=null; toast("Đã lưu phiếu "+r.id+", kho tổng đã cộng "+items.reduce((a,x)=>a+x.qty,0)+" món"+(r.newParts?" ("+r.newParts+" vật tư mới)":"")+".","ok",6000); }
};
function vPhieuNhap(){

    '<div class="small">Copy các cột theo đúng thứ tự từ Excel/Google Sheets rồi dán vào ô dưới. Dòng tiêu đề tự bỏ qua.</div>'
   +'<div class="tbl-wrap"><table><thead><tr><th>Nhóm</th><th>Phân loại</th><th>Đơn vị</th><th>Ngưỡng</th><th>Tồn tốt</th><th>Chờ sửa</th></tr></thead><tbody><tr><td>Lốp Xe / Mâm</td><td>Lốp Sau</td><td>Cái</td><td class="n">100</td><td class="n">212</td><td class="n">0</td></tr></tbody></table></div>'
   +'<div class="small muted">Cột Chờ sửa có thể bỏ trống. Phụ tùng đã có (cùng nhóm + tên) sẽ được cập nhật ngưỡng và <b>đặt lại số tồn</b> theo file.</div>'
   +'<div class="f"><label for="fPaste">Dán dữ liệu</label><textarea id="fPaste" style="min-height:180px;font-family:ui-monospace,monospace;font-size:13px" placeholder="Dán tại đây…"></textarea></div><div id="impPrev"></div>',
    '<button class="btn" type="button" data-a="impPreview">Xem trước</button><button class="btn pri" type="button" data-a="impSave">Nhập vào kho</button>');
};
function parseImport(){
  const txt=val("fPaste"); const out=[], bad=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim()) return; let c=line.split("\t"); if(c.length<3) c=line.split(/[;,]/);
    c=c.map(x=>x.trim());
    const [group,name,unit,th,tot,cho]=c;
    if(i===0 && /nh[oó]m|t[eê]n/i.test(group||"") && isNaN(Number(tot))) return;
    const nTot=Number(String(tot||"0").replace(/[^\d.-]/g,"")); const nTh=Number(String(th||"0").replace(/[^\d.-]/g,"")); const nCho=Number(String(cho||"0").replace(/[^\d.-]/g,""));
    if(!name || !isFinite(nTot)){ bad.push(i+1); return; }
    out.push({group:group||"Khác", name, unit:unit||"Cái", threshold:isFinite(nTh)?nTh:0, repairable:false, tot:nTot, cho:isFinite(nCho)?nCho:0});
  });
  return {rows:out, bad};
}
A.impPreview = ()=>{
  const {rows,bad}=parseImport(); const el=$("#impPrev");
  el.innerHTML = rows.length? '<div class="small"><b>'+rows.length+' dòng hợp lệ</b>'+(bad.length?' · bỏ qua dòng '+bad.join(", "):'')+'</div><div class="tbl-wrap"><table><thead><tr><th>Nhóm</th><th>Tên</th><th class="n">Ngưỡng</th><th class="n">Tồn</th><th class="n">Chờ sửa</th><th></th></tr></thead><tbody>'+rows.slice(0,80).map(r=>{ const ex=S.parts.has(slug(r.group+"-"+r.name)); return '<tr><td>'+esc(r.group)+'</td><td>'+esc(r.name)+'</td><td class="n">'+r.threshold+'</td><td class="n">'+r.tot+'</td><td class="n">'+r.cho+'</td><td class="small">'+(ex?"cập nhật":"mới")+'</td></tr>'; }).join("")+'</tbody></table></div>' : '<div class="banner small">Chưa đọc được dòng nào. Kiểm tra thứ tự cột.</div>';
};
A.impSave = async (d,btn)=>{
  const {rows}=parseImport(); if(!rows.length){ A.impPreview(); return; }
  btn.disabled=true; btn.textContent="Đang nhập "+rows.length+" dòng…";
  const r=await save(()=>api("importParts", rows));
  if(r){ toast("Đã nhập: "+r.added+" mới, "+r.updated+" cập nhật","ok"); closeModal(); } else { btn.disabled=false; btn.textContent="Nhập vào kho"; }
};
A.impKiemKe = d=>{
  const dat=d.v==="dat";
  modal(dat?"Đặt số đầu kỳ":"Nạp kiểm kê định kỳ", (dat
    ? '<div class="small">Thay <b>toàn bộ</b> số tồn của cả kho tổng và kệ xưởng bằng số trong file. Ô trống tính là 0. <b>Không</b> ghi chênh lệch, chỉ dùng khi bắt đầu hoặc làm lại từ đầu.</div>'
    : '<div class="small">So số trong file với sổ của app. Chỗ nào lệch, app ghi một dòng <b>Điều chỉnh</b> để hiện trong trang Đối chiếu. Ô để trống là không đếm, giữ nguyên.'+(S.isEditor?'':' Cột kho tổng sẽ được bỏ qua vì chỉ quản lý kiểm kê kho tổng.')+'</div>')+'<div class="f"><label for="fKK">File kiểm kê (Excel hoặc CSV)</label><input id="fKK" type="file" accept=".xlsx,.xls,.csv"><span class="hint">Dùng file mẫu tải từ app, hoặc file kiểm kê cũ tải về từ Google Sheet dạng Excel.</span></div>'+nameField("fBy","Người kiểm kê"),
    '<button class="btn pri" type="button" data-a="impKiemKeGo" data-v="'+(dat?"dat":"kiemke")+'">Nạp ngay</button>');
};
A.impKiemKeGo = async (d,btn)=>{
  const f=$("#fKK")&&$("#fKK").files[0]; if(!f){ toast("Chọn file kiểm kê.","bad"); return; }
  const by=readName(); if(!by) return;
  let table;
  try{ const X=await loadXlsx(); const wb=X.read(await f.arrayBuffer(),{type:"array"}); table=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true}); }
  catch(e){ toast("Không đọc được file: "+((e&&e.message)||e),"bad",6000); return; }
  btn.textContent="Đang nạp…";
  const r=await save(()=>api("importKiemKe", d.v, by, table));
  if(r){ closeModal(); modal("Đã nạp xong", '<p style="margin:0">'+esc(r)+'</p>'); } else btn.textContent="Nạp ngay";
};
A.kkMau = (d,btn)=>{
  const st=stockMap();
  const rows=[["Nhóm","Tên vật tư","Đơn vị","Ngưỡng kệ xưởng","Ngưỡng kho tổng","Tồn kho tổng","Kệ xưởng – hàng mới","Kệ xưởng – hàng đã sửa","Hư chờ kiểm tra","Sổ app: kho tổng","Sổ app: kệ mới","Sổ app: kệ đã sửa","Sổ app: hư chờ KT"]]
    .concat(sortedParts().map(p=>{ const s=st[p.id]||{tong:0,moi:0,sua:0,cho:0}; return [p.group||"",p.name,p.unit||"",p.threshold||0,p.threshTong||0,"","","","",s.tong,s.moi,s.sua,s.cho]; }));
  for(let i=0;i<30;i++) rows.push(["","","","","","","","","","","","",""]);
  return xuatNut(btn, "Tải file mẫu kiểm kê", "Kiểm kê vật tư Gokart "+fmtD(Date.now()), [{name:"Kiểm kê", rows}]);
};
A.editChecklist = ()=>{
  modal("Sửa checklist",
    '<div class="f"><label for="fDaily">Mục kiểm tra đầu ngày (mỗi dòng một mục)</label><textarea id="fDaily" style="min-height:170px">'+esc(daily().join("\n"))+'</textarea></div>'
   +'<div class="f"><label for="fMaint">Hạng mục bảo trì định kỳ theo xe</label><textarea id="fMaint" style="min-height:130px">'+esc(maintItems().join("\n"))+'</textarea></div>'
   +'<div class="f"><label for="fDays">Chu kỳ bảo trì (ngày)</label><input id="fDays" type="number" min="1" step="1" value="'+maintDays()+'"></div>',
    '<button class="btn pri" type="button" data-a="checklistSave">Lưu</button>');
};
A.checklistSave = async ()=>{
  const dl=val("fDaily").split("\n").map(s=>s.trim()).filter(Boolean), mt=val("fMaint").split("\n").map(s=>s.trim()).filter(Boolean);
  if(!dl.length||!mt.length){ toast("Mỗi danh sách cần ít nhất 1 mục.","bad"); return; }
  const ok=await save(()=>api("saveConfig",{dailyItems:dl, maintItems:mt, maintDays:Math.max(1,num("fDays")||7)}),"Đã lưu checklist"); if(ok) closeModal();
};
A.closeBook = ()=>{
  modal("Chốt sổ kho", '<div class="small">App sẽ lưu số tồn hiện tại của '+S.parts.size+' phụ tùng làm số đầu kỳ mới. Số tồn không thay đổi, lịch sử giao dịch vẫn giữ nguyên trong sheet GiaoDich.</div>', '<button class="btn pri" type="button" data-a="closeBookGo">Chốt sổ</button>');
};
A.closeBookGo = async (d,btn)=>{
  btn.disabled=true; btn.textContent="Đang chốt…";
  const n=await save(()=>api("closeBook"));
  if(n!==false){ toast("Đã chốt sổ "+n+" phụ tùng","ok"); closeModal(); } else btn.disabled=false;
};

/* ---------- go ---------- */
render();
boot();
</script>
